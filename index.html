<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>nikaoni — sesli, görüntülü ve yazılı sohbet</title>
<style>
:root{
  --bg:#07070f;
  --pnl:rgba(255,255,255,.05);
  --pnl2:rgba(255,255,255,.1);
  --g1:#a855f7;
  --g2:#22d3ee;
  --tx:#f0eefb;
  --mt:#9b9ab5;
  --grad:linear-gradient(90deg,var(--g1),var(--g2));
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:"Segoe UI",system-ui,-apple-system,sans-serif;
  background:
    radial-gradient(1200px 600px at 20% -10%,rgba(168,85,247,.14),transparent 60%),
    radial-gradient(1000px 500px at 90% 110%,rgba(34,211,238,.12),transparent 60%),
    var(--bg);
  color:var(--tx);
  height:100vh;
  overflow:hidden;
}
button,input{font:inherit}
::-webkit-scrollbar{width:8px}
::-webkit-scrollbar-thumb{background:var(--pnl2);border-radius:4px}

.gtx{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.gbtn{background:var(--grad);color:#fff;border:none;border-radius:10px;font-weight:700;cursor:pointer;transition:.15s;padding:12px;font-size:15px}
.gbtn:hover{filter:brightness(1.2);box-shadow:0 0 22px rgba(168,85,247,.45)}

/* ---------- giriş ---------- */
#loginScr{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
.bg-logo{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.bg-logo img{width:640px;max-width:90vw;opacity:.07;filter:blur(1px)}
.login-card{width:340px;max-width:92vw;padding:32px 28px;position:relative;
  background:rgba(14,14,26,.85);backdrop-filter:blur(8px);
  border:1px solid rgba(255,255,255,.09);border-radius:18px;
  box-shadow:0 0 44px rgba(168,85,247,.2)}
.login-head{text-align:center;margin-bottom:20px}
.logo-img{width:110px;border-radius:12px}
.login-head h1{font-size:24px;font-weight:800;margin-top:8px}
.login-head p{color:var(--mt);font-size:12px;margin-top:2px}
.login-form{display:flex;flex-direction:column;gap:10px}
.login-form input{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);
  border-radius:10px;padding:11px 14px;color:var(--tx);font-size:14px;outline:none;transition:.15s}
.login-form input:focus{border-color:var(--g1);box-shadow:0 0 14px rgba(168,85,247,.35)}
#err{color:#f472b6;font-size:12px;min-height:14px}
.login-alt{text-align:center;color:var(--mt);font-size:12px;margin-top:4px}
.login-alt .gtx{font-weight:700;cursor:pointer}
.shake{animation:shake .3s 2}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* ---------- üst bar ---------- */
#mainApp{display:flex;flex-direction:column;height:100vh}
.topbar{display:flex;align-items:center;gap:10px;padding:10px 16px;flex:none;
  border-bottom:1px solid rgba(255,255,255,.07);background:rgba(10,10,20,.7);backdrop-filter:blur(6px)}
.logo-sm{width:34px;border-radius:8px}
.brand{font-weight:800;font-size:16px}
.status-pill{color:var(--mt);font-size:12px;margin-left:auto;display:flex;align-items:center;gap:6px}
.live-dot{width:8px;height:8px;border-radius:50%;background:#34d399;box-shadow:0 0 8px #34d399}
.ghost-btn{background:transparent;border:1px solid var(--pnl2);color:var(--tx);
  border-radius:8px;padding:6px 12px;font-size:12px;cursor:pointer}
.ghost-btn:hover{border-color:var(--g1)}
.me-av{width:30px;height:30px;border-radius:10px;background:linear-gradient(135deg,var(--g1),var(--g2));
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;color:#fff}

/* ---------- düzen ---------- */
.layout{flex:1;display:flex;min-height:0}
#side{width:230px;padding:12px 8px;overflow-y:auto;flex:none}
.side-label{color:var(--mt);font-weight:800;font-size:11px;padding:6px 12px 6px;letter-spacing:1px}
.row{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;cursor:pointer;
  transition:.12s;color:var(--mt);font-size:14px}
.row:hover{background:var(--pnl);color:var(--tx)}
.row.on{background:linear-gradient(90deg,rgba(168,85,247,.25),rgba(34,211,238,.12));color:#fff;
  box-shadow:inset 0 0 0 1px rgba(168,85,247,.35)}
.av{border-radius:12px;display:flex;align-items:center;justify-content:center;color:#fff;
  font-weight:800;flex:none;position:relative}
.dot{position:absolute;right:-2px;bottom:-2px;width:11px;height:11px;border-radius:50%;
  background:#34d399;border:2.5px solid #0c0c18}
.dot.off{background:#5b5b70}
.row .count{margin-left:auto;font-size:11px;color:#34d399}
.row .sub{margin-left:auto;font-size:10px;color:var(--mt)}

#chatArea{flex:1;display:flex;flex-direction:column;min-width:0}
.chat-head{display:flex;align-items:center;gap:10px;padding:12px 16px;flex:none;
  border-bottom:1px solid rgba(255,255,255,.07)}
.chat-head .who{flex:1;min-width:0}
.chat-head .name{font-weight:800;font-size:14px}
.chat-head .st{font-size:11px}
.st.on{color:#34d399}.st.off{color:var(--mt)}
.callbtn{width:36px;height:36px;border-radius:10px;border:none;cursor:pointer;font-size:15px;
  display:flex;align-items:center;justify-content:center;transition:.12s;flex:none}
.callbtn.voice{background:var(--pnl2)}
.callbtn.video{background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff}

#msgList{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.msg-in{display:flex;gap:10px;max-width:75%}
.bubble-in{background:var(--pnl);border:1px solid rgba(255,255,255,.07);
  border-radius:4px 14px 14px 14px;padding:9px 13px;color:var(--tx);font-size:13px;overflow-wrap:anywhere}
.msg-meta{font-size:11px;color:var(--mt);margin-bottom:3px}
.msg-out{align-self:flex-end;max-width:70%}
.bubble-out{background:linear-gradient(90deg,rgba(168,85,247,.85),rgba(34,211,238,.7));
  border-radius:14px 14px 4px 14px;padding:9px 13px;color:#fff;font-size:13px;overflow-wrap:anywhere}

.composer{flex:none;padding:12px 16px}
.composer form{display:flex;gap:8px;background:var(--pnl);border:1px solid rgba(255,255,255,.08);
  border-radius:14px;padding:6px 6px 6px 14px;align-items:center}
.composer input{flex:1;background:none;border:none;outline:none;color:var(--tx);font-size:13px}
.composer .gbtn{padding:8px 16px;font-size:13px}

/* ---------- arama ---------- */
#callLay{position:fixed;inset:0;z-index:50;display:none;flex-direction:column;
  align-items:center;justify-content:center;gap:16px;
  background:rgba(7,7,15,.96);backdrop-filter:blur(10px)}
.call-title{font-weight:800;font-size:18px}
.call-timer{color:var(--mt);font-size:13px;font-variant-numeric:tabular-nums}
.tiles{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;max-width:660px}
.tile{width:180px;height:140px;border-radius:16px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:8px;position:relative;overflow:hidden;
  border:1px solid rgba(255,255,255,.1);
  background:linear-gradient(160deg,rgba(168,85,247,.16),rgba(34,211,238,.08))}
.tile .face{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:24px;color:#fff;box-shadow:0 0 24px rgba(168,85,247,.4)}
.tile .rec{position:absolute;top:8px;left:8px;font-size:10px;color:#fff;
  background:rgba(0,0,0,.4);padding:2px 7px;border-radius:6px}
.tile .tname{color:var(--tx);font-size:12px;font-weight:700;z-index:1}
.wbars{display:flex;gap:4px;align-items:flex-end;height:44px}
.wbar{width:4px;border-radius:2px;background:linear-gradient(180deg,var(--g2),var(--g1));
  animation:wave 1s infinite}
@keyframes wave{0%,100%{transform:scaleY(.4)}50%{transform:scaleY(1)}}
.call-controls{display:flex;gap:12px;margin-top:6px}
.ctl{width:44px;height:44px;border-radius:12px;border:none;cursor:pointer;font-size:17px;
  background:var(--pnl2);color:#fff;transition:.12s}
.ctl.end{width:56px;border-radius:28px;background:#ef4444}
.call-note{color:var(--mt);font-size:11px}

/* ---------- mobil ---------- */
@media (max-width:720px){
  #side{width:100%;display:flex;gap:4px;padding:8px;overflow-x:auto;overflow-y:hidden;
    border-bottom:1px solid rgba(255,255,255,.07);flex:none}
  .side-label{display:none}
  .row{flex:none;padding:8px 12px;white-space:nowrap}
  .row .count,.row .sub{display:none}
  .layout{flex-direction:column}
  #chatArea{flex:1}
  .status-pill{display:none}
  .tile{width:140px;height:110px}
}

</style>
</head>

<div id="callLay">
  <div class="call-title" id="callTitle"></div>
  <div class="call-timer" id="callTimer">00:00</div>
  <div class="tiles" id="tiles"></div>
  <div class="call-controls">
    <button class="ctl" id="muteBtn" title="Mikrofon">🎙️</button>
    <button class="ctl" id="camBtn" title="Kamera">📷</button>
    <button class="ctl end" id="endBtn" title="Kapat">📵</button>
  </div>
  <p class="call-note">Demo arama arayüzüdür — gerçek görüşmeler için WebRTC sunucusu gerekir.</p>

<script>
/* ================= nikaoni — uygulama mantığı ================= */
"use strict";

/* ---------- yardımcılar ---------- */
const colors = ["#a855f7","#7c5cff","#4cc3ff","#22d3ee","#e879f9","#34d399","#f472b6"];
function hashColor(s){
  let h = 0;
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 997;
  return colors[h % colors.length];
}
function avatar(name, size = 38){
  const s = size, c1 = hashColor(name), c2 = hashColor(name + "x");
  return `<div class="av" style="width:${s}px;height:${s}px;font-size:${Math.round(s*0.42)}px;
    background:linear-gradient(135deg,${c1},${c2})">${name[0].toUpperCase()}
    </div>`;
}
const $ = id => document.getElementById(id);

/* ---------- veri ---------- */
const FRIENDS = [["Elif",1],["Mert",1],["Kaan",1],["Zeynep",0],["Selin",0],["Deniz",1],["Rüzgar",0]];
const ROOMS   = [["Genel Sohbet",89],["Film Gecesi",64],["Oyun Lobisi",42],["Müzik Odası",31],["Kitap Kulübü",18]];

const REPLIES = [
  "Haha kesinlikle 😄","Yarın konuşalım mı?","Buna bayıldım!","Bir dakika, bakıyorum…",
  "Aynen öyle 👍","Bana da söyle o zaman!","Harika fikir ✨","Tamamdır, ayarlıyorum."
];

const DEFAULT_CONVO = {
  "Elif":[["Elif","Yarınki film gecesine geliyor musun? 🎬"],["sen","Kesinlikle! Saat kaçta?"],["Elif","21:00, odada buluşuruz"]],
  "Mert":[["Mert","CS2 turnuvası için takım kuruyoruz, yerin hazır 🎮"],["sen","Ben varım!"],["Mert","Süper, haritasını atarım"]],
  "Kaan":[["Kaan","Yeni lofi listesini dinledin mi?"],["sen","Dinledim, çok iyi olmuş 🎧"]],
  "Deniz":[["Deniz","Selam! Etkinlik takvimine baktın mı?"],["sen","Baktım, cumartesi buluşması varmış 📅"]],
  "Genel Sohbet":[["ayse","Herkese selam! 👋"],["can","Hoş geldin"],["mehmet","Bu akşam film odası açık 🍿"]],
  "Film Gecesi":[["selin","Bu hafta ne izliyoruz?"],["elif","Oylamaya bakalım 📽️"]],
  "Oyun Lobisi":[["mert","Ranked başlıyor, gelen var mı?"],["kaan","Ben geliyorum"]],
  "Müzik Odası":[["deniz","Şimdi çalıyor: lo-fi beats 🎵"]],
  "Kitap Kulübü":[["zeynep","Bu ayın kitabı: Tutunamayanlar"]]
};

/* oturum kalıcı sohbetler */
let convos = {};
try { convos = JSON.parse(localStorage.getItem("nikaoni_convos") || "{}"); } catch(e){ convos = {}; }
for (const k in DEFAULT_CONVO) if (!convos[k]) convos[k] = DEFAULT_CONVO[k];
function saveConvos(){ try{ localStorage.setItem("nikaoni_convos", JSON.stringify(convos)); }catch(e){} }

/* ---------- durum ---------- */
let target = "Elif", kind = "dm";
let timerInt = null, secs = 0, muted = false, camOff = false, mode = "video";

/* ---------- giriş ---------- */
function doLogin(){
  const e = $("email").value.trim(), p = $("pass").value, err = $("err");
  if (!e.includes("@") || e.length < 6){
    err.textContent = "Geçerli bir e-posta adresi gir.";
    $("loginCard").classList.add("shake");
    setTimeout(()=>$("loginCard").classList.remove("shake"), 700);
    return;
  }
  if (p.length < 4){ err.textContent = "Şifre en az 4 karakter olmalı."; return; }
  err.textContent = "";
  try{ localStorage.setItem("nikaoni_session", e); }catch(e2){}
  enterApp();
}
$("loginBtn").onclick = doLogin;
$("pass").addEventListener("keydown", e => { if (e.key === "Enter") doLogin(); });
$("email").addEventListener("keydown", e => { if (e.key === "Enter") doLogin(); });
$("logoutBtn").onclick = () => {
  try{ localStorage.removeItem("nikaoni_session"); }catch(e){}
  location.reload();
};

/* ---------- uygulama ---------- */
function enterApp(){
  $("loginScr").style.display = "none";
  $("mainApp").style.display = "flex";
  $("onlineCount").textContent = FRIENDS.filter(f => f[1]).length;
  renderSide();
  renderChat();
}
function renderSide(){
  $("side").innerHTML =
    `<div class="side-label">ARKADAŞLAR</div>` +
    FRIENDS.map(f =>
      `<div class="row ${kind==="dm" && target===f[0] ? "on":""}" data-t="${f[0]}" data-k="dm">
        <div style="position:relative">${avatar(f[0],32)}<span class="dot ${f[1]?"":"off"}"></span></div>
        ${f[0]}${f[1] ? "" : '<span class="sub">çevrimdışı</span>'}
      </div>`).join("") +
    `<div class="side-label">SOHBET ODALARI</div>` +
    ROOMS.map(r =>
      `<div class="row ${kind==="room" && target===r[0] ? "on":""}" data-t="${r[0]}" data-k="room">
        <span>◈</span> ${r[0]} <span class="count">${r[1]}</span>
      </div>`).join("");
  document.querySelectorAll("#side .row").forEach(el => {
    el.onclick = () => { target = el.dataset.t; kind = el.dataset.k; renderSide(); renderChat(); };
  });
}
function renderChat(){
  const isRoom = kind === "room";
  const title  = isRoom ? "◈ " + target : "@" + target.toLowerCase();
  const online = isRoom
    ? ROOMS.find(r => r[0] === target)[1] + " kişi odada"
    : (FRIENDS.find(f => f[0] === target)[1] ? "çevrimiçi" : "çevrimdışı");
  const msgs = convos[target] || [];
  $("chatArea").innerHTML = `
    <div class="chat-head">
      ${avatar(target, 34)}
      <div class="who">
        <div class="name">${title}</div>
        <div class="st ${online==="çevrimdışı" ? "off":"on"}">${online}</div>
      </div>
      <button class="callbtn voice" id="voiceBtn" title="Sesli ara">🎙️</button>
      <button class="callbtn video" id="videoBtn" title="Görüntülü ara">📹</button>
    </div>
    <div id="msgList">${
      msgs.map(m => m[0] === "sen"
        ? `<div class="msg-out"><div class="bubble-out">${esc(m[1])}</div></div>`
        : `<div class="msg-in">${avatar(m[0],32)}
             <div><div class="msg-meta">${esc(m[0])}</div>
             <div class="bubble-in">${esc(m[1])}</div></div>
           </div>`).join("")
    }</div>
    <div class="composer"><form id="cform">
      <input id="msgInp" placeholder="${title} kişisine mesaj gönder…" maxlength="300" autocomplete="off">
      <button type="submit" class="gbtn">Gönder</button>
    </form></div>`;
  $("cform").onsubmit = e => { e.preventDefault(); sendMsg(); };
  $("voiceBtn").onclick = () => startCall("voice");
  $("videoBtn").onclick = () => startCall("video");
  const l = $("msgList"); l.scrollTop = l.scrollHeight;
}
function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function sendMsg(){
  const i = $("msgInp");
  if (!i.value.trim()) return;
  convos[target] = convos[target] || [];
  convos[target].push(["sen", i.value.trim()]);
  saveConvos();
  i.value = "";
  renderChat();
  autoReply();
}
function autoReply(){
  const who = kind === "room" ? "oda" : target;
  const partnerOnline = kind === "room" ? true : FRIENDS.find(f => f[0] === target)[1];
  if (!partnerOnline) return;
  const name = kind === "room" ? ["ayse","can","mehmet","selin"][Math.floor(Math.random()*4)] : target;
  setTimeout(() => {
    convos[target].push([name, REPLIES[Math.floor(Math.random() * REPLIES.length)]]);
    saveConvos();
    if ($("msgList")) renderChat();
  }, 900 + Math.random() * 1400);
}

/* ---------- arama ---------- */
function startCall(m){
  mode = m; secs = 0; muted = false; camOff = false;
  $("muteBtn").style.background = ""; $("muteBtn").textContent = "🎙️";
  $("camBtn").style.background = ""; $("camBtn").textContent = "📷";
  $("callLay").style.display = "flex";
  $("callTitle").textContent =
    (m === "video" ? "📹 Görüntülü arama — " : "🎙️ Sesli arama — ") +
    (kind === "dm" ? "@" + target.toLowerCase() : target);
  renderTiles();
  $("callTimer").textContent = "00:00";
  clearInterval(timerInt);
  timerInt = setInterval(() => {
    secs++;
    $("callTimer").textContent =
      String(Math.floor(secs/60)).padStart(2,"0") + ":" + String(secs%60).padStart(2,"0");
  }, 1000);
}
function renderTiles(){
  const names = kind === "dm"
    ? [target, "Sen"]
    : ["Sen", "ayse", "mehmet", "selin"].slice(0, 4);
  $("tiles").innerHTML = names.map((n, i) => {
    const videoOn = mode === "video" && !camOff && n !== "Sen" || (mode === "video" && !camOff);
    const body = videoOn
      ? `<div class="face" style="background:linear-gradient(135deg,${hashColor(n)},${hashColor(n+"x")})">${n[0].toUpperCase()}</div>
         ${mode==="video" ? '<div class="rec">REC ●</div>' : ""}`
      : `<div class="wbars">${[0,1,2,3,4].map(j =>
          `<div class="wbar" style="height:${14+((i*7+j*13)%26)}px;animation-delay:${j*0.12}s"></div>`).join("")}</div>`;
    return `<div class="tile">${body}<div class="tname">${n}</div></div>`;
  }).join("");
}
$("muteBtn").onclick = function(){
  muted = !muted;
  this.style.background = muted ? "#ef4444" : "";
  this.textContent = muted ? "🔇" : "🎙️";
};
$("camBtn").onclick = function(){
  camOff = !camOff;
  this.style.background = camOff ? "#ef4444" : "";
  this.textContent = camOff ? "🚫" : "📷";
  if (mode === "video") renderTiles();
};
$("endBtn").onclick = () => {
  clearInterval(timerInt);
  $("callLay").style.display = "none";
};

(function(){
  let session = null;
  try{ session = localStorage.getItem("nikaoni_session"); }catch(e){}
  if (session) enterApp();
})();
